name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: nix-enabled-runners
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build
        run: nix build .#lib --quiet

      - name: Test
        run: nix build .#unit-tests --quiet

      - name: Fourmolu
        run: nix develop --command fourmolu -m check lib test

      - name: HLint
        run: nix develop --command hlint lib test

      - name: Nixfmt
        run: nix develop --command nixfmt --check flake.nix nix/*.nix

  docs:
    runs-on: nix-enabled-runners
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop github:paolino/dev-assets?dir=mkdocs -c mkdocs build --strict

  web:
    runs-on: nix-enabled-runners
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            ~/.ghc-wasm/.cabal/packages
          key: ghc-wasm-${{ runner.os }}-all-9-12-${{ hashFiles('cabal-wasm.project', 'cardano-coin-selection.cabal', 'flake.lock', 'web/flake.lock', 'web/spago.lock', 'web/package-lock.json') }}
          restore-keys: |
            ghc-wasm-${{ runner.os }}-all-9-12-

      - name: Web CI
        run: cd web && nix develop --quiet -c just ci

  wasm:
    runs-on: nix-enabled-runners
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            ~/.ghc-wasm/.cabal/packages
          key: ghc-wasm-${{ runner.os }}-all-9-12-${{ hashFiles('cabal-wasm.project', 'cardano-coin-selection.cabal', 'flake.lock') }}
          restore-keys: |
            ghc-wasm-${{ runner.os }}-all-9-12-

      - name: Capture native smoke output
        run: |
          mkdir -p "$RUNNER_TEMP/coin-select-smoke"
          nix develop --quiet -c bash -c "
            set -euo pipefail
            cabal build -O0 exe:coin-select-smoke >&2
            exe=\$(cabal list-bin -O0 exe:coin-select-smoke)
            \"\$exe\"
          " > "$RUNNER_TEMP/coin-select-smoke/native.out"

      - name: Capture native text output
        run: |
          mkdir -p "$RUNNER_TEMP/coin-select"
          cat > "$RUNNER_TEMP/coin-select/input.txt" <<'EOF'
          utxo input-1 2000000
          utxo input-2 3000000
          utxo input-3 5000000
          output target-address 4500000
          EOF
          nix develop --quiet -c bash -c '
            set -euo pipefail
            cabal build -O0 exe:coin-select >&2
            exe=$(cabal list-bin -O0 exe:coin-select)
            "$exe" < "$1"
          ' bash "$RUNNER_TEMP/coin-select/input.txt" > "$RUNNER_TEMP/coin-select/native.out"

      - name: Build WASM smoke
        run: |
          nix shell 'gitlab:haskell-wasm/ghc-wasm-meta?host=gitlab.haskell.org#all_9_12' --command bash -c "
            set -euo pipefail
            wasm32-wasi-cabal update
            wasm32-wasi-cabal --project-file=cabal-wasm.project build exe:coin-select-smoke
            wasm32-wasi-cabal --project-file=cabal-wasm.project build exe:coin-select
          "

      - name: Run WASM smoke
        run: |
          set -euo pipefail
          wasm=$(find dist-newstyle -name "coin-select-smoke.wasm" -type f | head -1)
          test -n "$wasm"
          printf 'COIN_SELECT_SMOKE_WASM=%s\n' "$wasm" >> "$GITHUB_ENV"
          WASM_SMOKE="$wasm" nix shell 'gitlab:haskell-wasm/ghc-wasm-meta?host=gitlab.haskell.org#all_9_12' --command bash -c "wasmtime \"\$WASM_SMOKE\"" > "$RUNNER_TEMP/coin-select-smoke/wasm.out"

      - name: Compare smoke outputs
        run: diff -u "$RUNNER_TEMP/coin-select-smoke/native.out" "$RUNNER_TEMP/coin-select-smoke/wasm.out"

      - name: Run WASM text executable
        run: |
          set -euo pipefail
          wasm=$(find dist-newstyle -name "coin-select.wasm" -type f | head -1)
          test -n "$wasm"
          printf 'COIN_SELECT_WASM=%s\n' "$wasm" >> "$GITHUB_ENV"
          WASM_SELECT="$wasm" SAMPLE_INPUT="$RUNNER_TEMP/coin-select/input.txt" nix shell 'gitlab:haskell-wasm/ghc-wasm-meta?host=gitlab.haskell.org#all_9_12' --command bash -c "wasmtime \"\$WASM_SELECT\" < \"\$SAMPLE_INPUT\"" > "$RUNNER_TEMP/coin-select/wasm.out"

      - name: Compare text outputs
        run: diff -u "$RUNNER_TEMP/coin-select/native.out" "$RUNNER_TEMP/coin-select/wasm.out"

      - uses: actions/upload-artifact@v4
        with:
          name: coin-select-wasm
          path: |
            ${{ env.COIN_SELECT_SMOKE_WASM }}
            ${{ env.COIN_SELECT_WASM }}
          if-no-files-found: error
