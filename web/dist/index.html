<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Cardano Coin Selection</title>
    <style>
      :root {
        color: #202428;
        background: #f4f6f5;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      button,
      textarea {
        font: inherit;
      }

      .app-shell {
        min-height: 100vh;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #d9dee2;
        padding-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
      }

      .status {
        margin: 0;
        color: #50615c;
        font-size: 0.95rem;
      }

      .status.error {
        color: #a43d2a;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 20px;
      }

      .panel {
        min-width: 0;
        border: 1px solid #d9dee2;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #e4e8eb;
        font-size: 0.95rem;
      }

      .input-form,
      .result-body,
      .result-status,
      .error-box {
        padding: 16px;
      }

      .input-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .field-label {
        color: #394742;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .input-textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        border: 1px solid #cbd5d1;
        border-radius: 6px;
        padding: 12px;
        background: #fbfcfc;
        color: #202428;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 0.95rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
      }

      .input-textarea:focus {
        outline: 3px solid #b7ddd1;
        border-color: #27745f;
        background: #ffffff;
      }

      .action-row {
        display: flex;
        justify-content: flex-end;
      }

      .run-button {
        border: 1px solid #1f6f5b;
        border-radius: 6px;
        background: #1f6f5b;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
        min-height: 40px;
        padding: 0 16px;
      }

      .run-button:hover:not(:disabled),
      .run-button:focus-visible {
        background: #185947;
        border-color: #185947;
      }

      .run-button:focus-visible {
        outline: 3px solid #b7ddd1;
        outline-offset: 2px;
      }

      .run-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .result-status {
        color: #50615c;
      }

      .error-box {
        background: #fff6f2;
        border-top: 1px solid #f1c7b8;
        color: #8f2f1f;
        line-height: 1.5;
      }

      .result-body {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .result-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      .result-table th,
      .result-table td {
        border-bottom: 1px solid #e4e8eb;
        padding: 10px 8px;
        text-align: left;
      }

      .result-table th {
        color: #394742;
        font-size: 0.82rem;
        font-weight: 750;
        text-transform: uppercase;
      }

      .result-table td {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
      }

      .change-summary {
        align-items: baseline;
        background: #eef7f4;
        border: 1px solid #c8e1d8;
        border-radius: 6px;
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding: 12px;
      }

      .change-label {
        color: #394742;
        font-weight: 700;
      }

      .change-value {
        color: #174f42;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
        font-size: 1rem;
      }

      @media (max-width: 760px) {
        .app-shell {
          padding: 20px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .change-summary {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <script src="./index.js" defer></script>
  </body>
</html>
