<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Cardano Coin Selection</title>
    <style>
      :root {
        color: #202428;
        background: #f5f7f8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      .app-shell {
        min-height: 100vh;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #d9dee2;
        padding-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
      }

      .status {
        margin: 0;
        color: #52616b;
        font-size: 0.95rem;
      }

      .status.error {
        color: #9f2d2d;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 20px;
      }

      .panel {
        min-width: 0;
        border: 1px solid #d9dee2;
        border-radius: 8px;
        background: #ffffff;
      }

      .panel h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #e4e8eb;
        font-size: 0.95rem;
      }

      pre {
        margin: 0;
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 0.95rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
      }

      @media (max-width: 760px) {
        .app-shell {
          padding: 20px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <script src="./index.js" defer></script>
  </body>
</html>
